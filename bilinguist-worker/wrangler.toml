name = "bilinguist-brief"
main = "src/index.ts"
compatibility_date = "2024-09-23"

# ── D1 word dictionary ────────────────────────────────────────────────────────
# Uncomment once the database is created:
#   wrangler d1 create bilinguist-words
# [[d1_databases]]
# binding  = "WORDS_DB"
# database_name = "bilinguist-words"
# database_id   = "REPLACE_WITH_YOUR_D1_ID"

# ── R2 audio cache ────────────────────────────────────────────────────────────
# Uncomment once the bucket is created:
#   wrangler r2 bucket create bilinguist-audio
# [[r2_buckets]]
# binding     = "AUDIO_BUCKET"
# bucket_name = "bilinguist-audio"

# ── Secrets — never put values here ──────────────────────────────────────────
# Set each with: wrangler secret put <NAME>
# Or via Cloudflare dashboard → Workers → bilinguist-brief → Settings → Variables
#
#   GITHUB_TOKEN       — GitHub PAT for reading bilinguist-data repo (already set)
#   ANTHROPIC_API_KEY  — for generating word explanations on cache miss
#   WORKER_ADMIN_KEY   — random string used by populate script (set to anything strong)
#   ELEVENLABS_API_KEY — for synthesising article audio on first play (cached to R2 after)
#   NTFY_TOPIC         — ntfy.sh topic for failure alerts (same value as GitHub Actions secret)
