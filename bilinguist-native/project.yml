name: BilinguistBrief
options:
  bundleIdPrefix: com.willdiggle
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true

targets:
  BilinguistBrief:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: BilinguistApp.swift
      - path: Models
      - path: Services
      - path: Stores
      - path: Views
    settings:
      base:
        PRODUCT_NAME: BilinguistBrief
        PRODUCT_BUNDLE_IDENTIFIER: com.willdiggle.bilinguistbrief
        SWIFT_VERSION: 5.9
        TARGETED_DEVICE_FAMILY: "1"
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        SWIFT_EMIT_LOC_STRINGS: YES
        INFOPLIST_FILE: ""
        GENERATE_INFOPLIST_FILE: YES
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 1.0
