name: Generate Daily Briefings

on:
  workflow_dispatch:
  push:
    branches:
      - claude/build-app-from-brief-wNEna
  pull_request:
    branches:
      - claude/build-app-from-brief-wNEna

jobs:
  generate:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 360

    env:
      # Actions gives Python a pipe, not a TTY, so stdout is block-buffered: output
      # sits in an 8KB buffer and is only flushed when the process exits. When a run
      # is cancelled the buffer is discarded, so a hung step shows NOTHING at all —
      # two 2h+ stalls on 2026-08-22 produced zero log lines, which made them
      # impossible to diagnose from the run. Unbuffered means progress streams live.
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout app repo
        uses: actions/checkout@v4
        with:
          ref: claude/build-app-from-brief-wNEna

      - name: Notify started
        run: |
          curl -s -X POST \
            -H "Title: Bilinguist Brief - Generating" \
            -H "Tags: newspaper" \
            -d "Brief Generating." \
            https://ntfy.sh/${{ secrets.NTFY_TOPIC }} || true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        working-directory: bilinguist-brief/scripts
        run: pip install -r requirements.txt

      - name: Set pipeline date
        run: |
          echo "BRIEF_DATE=$(python3 -c "import datetime; print(datetime.datetime.now(datetime.timezone.utc).strftime('%Y-%m-%d'))")" >> $GITHUB_ENV

      - name: Prompt checks (no API calls)
        working-directory: bilinguist-brief/scripts
        # Fails the run before a single Gemini call if a prompt has an unsubstituted
        # placeholder, has lost a required section, or the word-count ladder disagrees
        # between write.py and check.py.
        run: python test_prompts.py

      - name: Stage 1 - Scrape headlines
        working-directory: bilinguist-brief/scripts
        env:
          BRIEF_DATE: ${{ env.BRIEF_DATE }}
        run: python bilinguist_scrape.py

      - name: Stage 2 - Select stories (group headlines, rank in Python)
        working-directory: bilinguist-brief/scripts
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          BRIEF_DATE: ${{ env.BRIEF_DATE }}
        # Selection only — no facts, no glossary, no 60-headline transcript.
        run: |
          python bilinguist_gather.py --select-only
          cp factbase_${{ env.BRIEF_DATE }}.json selection.json

      - name: Stage 3 - Gather facts for the ranked winners
        working-directory: bilinguist-brief/scripts
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          BRIEF_DATE: ${{ env.BRIEF_DATE }}
        # --per-story: one dedicated Gemini+Search call per story, never shared with other
        # stories in the same genre. Adopted 2026-08-13 after a real production run showed
        # the previous genre-batched call starving a later story to 9 facts (below even the
        # 10-point floor) while the lead story in the same call got 617 narrative words —
        # the model spends its effort on the first story in a shared context. --facts-input
        # no longer applies: --per-story is its own code path with its own per-story prompt.
        run: python bilinguist_gather.py --from selection.json --per-story

      - name: Guard - the factbase must have facts, a notification and a search log
        working-directory: bilinguist-brief/scripts
        # Stage 2 legitimately produces no facts, so a selection file that never reached
        # Stage 3 would otherwise flow on and publish a brief with nothing to write from.
        run: |
          python - <<'PY'
          import json, os, sys
          d = json.load(open(f"factbase_{os.environ['BRIEF_DATE']}.json", encoding="utf-8"))
          bad = []
          empty = [s.get("slug") for s in d.get("factbase", []) if not (s.get("what_happened") or [])]
          if empty:
              bad.append(f"stories with no facts: {empty}")
          if not (d.get("daily_notification") or "").strip():
              bad.append("daily_notification is empty")
          if not d.get("global_news_search_log"):
              bad.append("global_news_search_log is empty")
          print(f"{len(d.get('factbase', []))} stories | notification: "
                f"{(d.get('daily_notification') or '')[:120]}")
          if bad:
              sys.exit("GUARD FAILED — " + "; ".join(bad))
          print("guard passed")
          PY

      - name: Stage 4 - Verify the factbase
        working-directory: bilinguist-brief/scripts
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          BRIEF_DATE: ${{ env.BRIEF_DATE }}
        run: python bilinguist_factcheck.py

      - name: Stages 5-8 - Write and grade
        working-directory: bilinguist-brief/scripts
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          BRIEF_DATE: ${{ env.BRIEF_DATE }}
        # --per-article: one call per (language, level, length, story). The A/B on
        # 2026-08-08 ran both arms from an identical factbase: per-article was
        # closer to target on 15 combos vs 1, landed 8 in band vs 3, and ran 2.5x
        # faster (20s vs 49s) for +14% cost. Variety was unaffected — openings
        # stayed 100% distinct in 15 of 18 combos.
        # --workers 16: per-article makes ~3.5x more calls; 4 would serialise it.
        # --levels-from native: Stage 7 rewrites the graded native article of the same
        # language, length and story down to each level, instead of writing every level
        # from the fact-base. Adopted from the A/B on 2026-08-10 (run over 252 articles):
        # fact order held in 91% of level articles against 60% for the fact-base arm, and
        # it was closer on `longer` (7w off centre vs 18w), marginally cheaper and the
        # same speed.
        #
        # Stage 5 itself (internal key "3") is two phases as of 2026-08-14, not every
        # language writing independently from the fact-base: English native is written
        # once per (story, length) directly from the fact-base, then every other language
        # (fr/de/sv/it, plus es as an internal-only intermediate) translates that exact
        # English article "as their own outlet's journalist would." This is what "the
        # translation happens once, in native" now means in practice — one EN source, not
        # one independent write per language. Plain-text output (no forced JSON) throughout.
        # See run_native_journalism() in bilinguist_write.py for the full history.
        #
        # Flex tier (50% discount, 1-15 min latency) is applied per-stage inside
        # bilinguist_write.py's SERVICE_TIER_BY_STAGE dict, not via a CLI flag here — it
        # currently covers native+translate (stage 3), all three level-rewrite stages
        # (2B/2S/2M) and level grading (4b); native grading (4a) and native fact-check (5b,
        # a separate step below) stay standard tier. Change SERVICE_TIER_BY_STAGE directly
        # to adjust which stages are on Flex, not this workflow file.
        run: python bilinguist_write.py --date ${{ env.BRIEF_DATE }} --per-article --workers 16 --levels-from native --all-levels

      - name: Stage 9 - Check completeness
        working-directory: bilinguist-brief/scripts
        run: python bilinguist_check.py

      # Stage 10 (Enrich) - dictionary enrichment disabled until new API source is wired up
      # - name: Stage 10 - Enrich word dictionary

      - name: Push bundle to data repo
        env:
          DATA_REPO_TOKEN: ${{ secrets.DATA_REPO_TOKEN }}
        run: |
          DATE=${{ env.BRIEF_DATE }}

          git clone https://x-access-token:${DATA_REPO_TOKEN}@github.com/will-diggle/bilinguist-data.git /tmp/bilinguist-data

          mkdir -p /tmp/bilinguist-data/briefings
          mkdir -p /tmp/bilinguist-data/reports

          cp bilinguist-brief/scripts/output/latest.json /tmp/bilinguist-data/latest.json
          cp bilinguist-brief/scripts/output/${DATE}.json /tmp/bilinguist-data/briefings/${DATE}.json

          # Structured report for the companion iOS app — written by
          # bilinguist_check.py (Stage 9, above). Not required: an older
          # bilinguist_check.py or a run where it failed to write its report
          # shouldn't block the actual briefing from publishing.
          REPORT_JSON="bilinguist-brief/scripts/output/report_${DATE}.json"
          if [ -f "$REPORT_JSON" ]; then
            cp "$REPORT_JSON" /tmp/bilinguist-data/reports/${DATE}.json
            cp "$REPORT_JSON" /tmp/bilinguist-data/reports/latest.json
          fi

          COSTS_JSON="bilinguist-brief/scripts/output/costs_${DATE}.json"
          if [ -f "$COSTS_JSON" ]; then
            python3 bilinguist-brief/scripts/update_costs_csv.py "$COSTS_JSON" "/tmp/bilinguist-data/costs.csv"
          fi

          cd /tmp/bilinguist-data
          git config user.email "actions@github.com"
          git config user.name "Bilinguist Brief Bot"
          git add latest.json briefings/${DATE}.json
          [ -f reports/${DATE}.json ] && git add reports/${DATE}.json reports/latest.json || true
          [ -f costs.csv ] && git add costs.csv || true

          if git diff --cached --quiet; then
            echo "No changes to commit - briefing for ${DATE} already pushed."
          else
            git commit -m "Daily briefings: ${DATE}"
            git push
          fi

      - name: Notify success
        if: success()
        env:
          NTFY_TITLE: ${{ env.BRIEF_TITLE }}
          NTFY_BODY: ${{ env.BRIEF_BODY }}
          NTFY_EMOJI: ${{ env.BRIEF_EMOJI }}
          NTFY_DATE: ${{ env.BRIEF_DATE }}
        run: |
          if [ -z "$NTFY_TITLE" ]; then
            NTFY_TITLE="Bilinguist Brief - Done"
            NTFY_BODY="Briefing for ${NTFY_DATE} is ready."
          fi
          curl -s -X POST \
            -H "Title: ${NTFY_TITLE}" \
            -H "Tags: ${NTFY_EMOJI}" \
            -H "Content-Type: text/markdown" \
            -H "X-Icon: https://raw.githubusercontent.com/will-diggle/Claude-Routines/claude/build-app-from-brief-wNEna/bilinguist-brief/assets/icon-navy.png" \
            --data-binary "${NTFY_BODY}" \
            https://ntfy.sh/${{ secrets.NTFY_TOPIC }} || true

      - name: Notify failure
        if: failure()
        run: |
          curl -s -X POST \
            -H "Title: Bilinguist Brief - Failed" \
            -H "Priority: high" \
            -H "Tags: rotating_light" \
            -d "Briefing generation failed. Check GitHub Actions for details: https://github.com/will-diggle/Claude-Routines/actions" \
            https://ntfy.sh/${{ secrets.NTFY_TOPIC }} || true

      # Real push to the Piggy Figs iOS app, via Expo's push API — separate from
      # the ntfy calls above, which stay as a fallback/other-subscribers channel.
      # EXPO_PUSH_TOKEN comes from Settings → Notifications → Enable notifications
      # in the app; empty/unset just no-ops rather than failing the run.
      - name: Push notification (success) to Piggy Figs
        if: success()
        env:
          EXPO_PUSH_TOKEN: ${{ secrets.EXPO_PUSH_TOKEN }}
          PUSH_TITLE: ${{ env.BRIEF_TITLE }}
          PUSH_DATE: ${{ env.BRIEF_DATE }}
        run: |
          if [ -z "$EXPO_PUSH_TOKEN" ]; then
            echo "EXPO_PUSH_TOKEN not set — skipping app push."
            exit 0
          fi
          TITLE="${PUSH_TITLE:-Bilinguist Brief - Done}"
          curl -s -X POST https://exp.host/--/api/v2/push/send \
            -H "Content-Type: application/json" \
            -H "Accept: application/json" \
            -d "$(jq -n --arg to "$EXPO_PUSH_TOKEN" --arg title "$TITLE" --arg date "$PUSH_DATE" \
              '{to: $to, title: $title, body: ("Report for " + $date + " is ready."), sound: "default", data: {screen: "Pipeline"}}')" \
            || true

      - name: Push notification (failure) to Piggy Figs
        if: failure()
        env:
          EXPO_PUSH_TOKEN: ${{ secrets.EXPO_PUSH_TOKEN }}
        run: |
          if [ -z "$EXPO_PUSH_TOKEN" ]; then
            echo "EXPO_PUSH_TOKEN not set — skipping app push."
            exit 0
          fi
          curl -s -X POST https://exp.host/--/api/v2/push/send \
            -H "Content-Type: application/json" \
            -H "Accept: application/json" \
            -d "$(jq -n --arg to "$EXPO_PUSH_TOKEN" \
              '{to: $to, title: "Bilinguist Brief - Failed", body: "Briefing generation failed — check GitHub Actions.", sound: "default", priority: "high", data: {screen: "Pipeline"}}')" \
            || true
