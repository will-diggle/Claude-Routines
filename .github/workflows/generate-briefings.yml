name: Generate Daily Briefings

on:
  workflow_dispatch:
  push:
    branches:
      - claude/build-app-from-brief-wNEna
  pull_request:
    branches:
      - claude/build-app-from-brief-wNEna

jobs:
  generate:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout app repo
        uses: actions/checkout@v4
        with:
          ref: claude/build-app-from-brief-wNEna

      - name: Notify started
        run: |
          curl -s -X POST \
            -H "Title: Bilinguist Brief - Generating" \
            -H "Tags: newspaper" \
            -d "Daily briefing generation started for $(date -u +%Y-%m-%d). Usually ready in 20-30 minutes." \
            https://ntfy.sh/${{ secrets.NTFY_TOPIC }} || true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        working-directory: bilinguist-brief/scripts
        run: pip install -r requirements.txt

      - name: Set pipeline date
        run: |
          echo "BRIEF_DATE=$(python3 -c "import datetime; print(datetime.datetime.now(datetime.timezone.utc).strftime('%Y-%m-%d'))")" >> $GITHUB_ENV

      - name: Stage 1 - Gather news
        working-directory: bilinguist-brief/scripts
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          BRIEF_DATE: ${{ env.BRIEF_DATE }}
        run: python bilinguist_gather.py

      - name: Stages 2-4 - Write and grade
        working-directory: bilinguist-brief/scripts
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          BRIEF_DATE: ${{ env.BRIEF_DATE }}
        run: python bilinguist_write.py --date ${{ env.BRIEF_DATE }}

      - name: Check completeness
        working-directory: bilinguist-brief/scripts
        run: python bilinguist_check.py

      - name: Push bundle to data repo
        env:
          DATA_REPO_TOKEN: ${{ secrets.DATA_REPO_TOKEN }}
        run: |
          DATE=${{ env.BRIEF_DATE }}

          git clone https://x-access-token:${DATA_REPO_TOKEN}@github.com/will-diggle/bilinguist-data.git /tmp/bilinguist-data

          mkdir -p /tmp/bilinguist-data/briefings

          cp bilinguist-brief/scripts/output/latest.json /tmp/bilinguist-data/latest.json
          cp bilinguist-brief/scripts/output/${DATE}.json /tmp/bilinguist-data/briefings/${DATE}.json

          COSTS_JSON="bilinguist-brief/scripts/output/costs_${DATE}.json"
          if [ -f "$COSTS_JSON" ]; then
            python3 - "$COSTS_JSON" "/tmp/bilinguist-data/costs.csv" <<'PYEOF'
import json, sys, csv, os
costs_path, csv_path = sys.argv[1], sys.argv[2]
with open(costs_path) as f:
    c = json.load(f)
s = c.get("stages", {})
header = ["date","total_calls","input_tokens","output_tokens","thinking_tokens",
          "total_usd","total_gbp","gather_usd","stage_2s_usd","stage_2m_usd","stage_3_usd","stage_4_usd"]
row = [
    c["date"],
    sum(s[st].get("calls",0) for st in s),
    sum(s[st].get("input_tokens",0) for st in s),
    sum(s[st].get("output_tokens",0) for st in s),
    sum(s[st].get("thinking_tokens",0) for st in s),
    c["total_usd"], c["total_gbp"],
    s.get("1_gather",{}).get("cost_usd",0),
    s.get("2S",{}).get("cost_usd",0),
    s.get("2M",{}).get("cost_usd",0),
    s.get("3",{}).get("cost_usd",0),
    s.get("4",{}).get("cost_usd",0),
]
write_header = not os.path.exists(csv_path) or os.path.getsize(csv_path) == 0
with open(csv_path, "a", newline="") as f:
    w = csv.writer(f)
    if write_header:
        w.writerow(header)
    w.writerow(row)
print(f"Cost row appended: ${c['total_usd']:.4f} / £{c['total_gbp']:.4f}")
PYEOF
          fi

          cd /tmp/bilinguist-data
          git config user.email "actions@github.com"
          git config user.name "Bilinguist Brief Bot"
          git add latest.json briefings/${DATE}.json
          [ -f costs.csv ] && git add costs.csv || true

          if git diff --cached --quiet; then
            echo "No changes to commit - briefing for ${DATE} already pushed."
          else
            git commit -m "Daily briefings: ${DATE}"
            git push
          fi

      - name: Notify success
        if: success()
        run: |
          curl -s -X POST \
            -H "Title: Bilinguist Brief - Done" \
            -H "Tags: white_check_mark" \
            -d "Briefing for ${{ env.BRIEF_DATE }} is ready." \
            https://ntfy.sh/${{ secrets.NTFY_TOPIC }} || true

      - name: Notify failure
        if: failure()
        run: |
          curl -s -X POST \
            -H "Title: Bilinguist Brief - Failed" \
            -H "Priority: high" \
            -H "Tags: rotating_light" \
            -d "Briefing generation failed. Check GitHub Actions for details: https://github.com/will-diggle/Claude-Routines/actions" \
            https://ntfy.sh/${{ secrets.NTFY_TOPIC }} || true
