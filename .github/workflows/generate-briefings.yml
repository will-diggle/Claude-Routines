name: Generate Daily Briefings

on:
  # Triggered daily by cron-job.org at 06:30 Europe/Vienna (CEST/CET).
  # cron-job.org POSTs to the GitHub dispatches API — more reliable than
  # GitHub's own scheduler which can be delayed by up to 60 minutes.
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout app repo
        uses: actions/checkout@v4

      - name: Notify — started
        run: |
          curl -s -X POST \
            -H "Title: Bilinguist Brief — Generating 🗞️" \
            -H "Tags: newspaper" \
            -d "Daily briefing generation started for $(date -u +%Y-%m-%d). Usually ready in 20–30 minutes." \
            https://ntfy.sh/${{ secrets.NTFY_TOPIC }} || true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        working-directory: bilinguist-brief/scripts
        run: pip install -r requirements.txt

      - name: Stage 1 — Gather news (Gemini Flex + search)
        working-directory: bilinguist-brief/scripts
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python bilinguist_gather.py

      - name: Stages 2–4 — Write and grade (Gemini Batch)
        working-directory: bilinguist-brief/scripts
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python bilinguist_write.py

      - name: Push bundle to data repo
        env:
          DATA_REPO_TOKEN: ${{ secrets.DATA_REPO_TOKEN }}
        run: |
          DATE=$(python3 -c "import datetime; print(datetime.datetime.now(datetime.timezone.utc).strftime('%Y-%m-%d'))")

          git clone https://x-access-token:${DATA_REPO_TOKEN}@github.com/will-diggle/bilinguist-data.git /tmp/bilinguist-data

          mkdir -p /tmp/bilinguist-data/briefings

          cp bilinguist-brief/scripts/output/latest.json /tmp/bilinguist-data/latest.json
          cp bilinguist-brief/scripts/output/${DATE}.json /tmp/bilinguist-data/briefings/${DATE}.json

          cd /tmp/bilinguist-data
          git config user.email "actions@github.com"
          git config user.name "Bilinguist Brief Bot"
          git add latest.json briefings/${DATE}.json
          git commit -m "Daily briefings: ${DATE}"
          git push

      - name: Notify — success
        if: success()
        run: |
          curl -s -X POST \
            -H "Title: Bilinguist Brief — Ready ✅" \
            -H "Tags: white_check_mark" \
            -d "Today's briefings are live. Open the app to read." \
            https://ntfy.sh/${{ secrets.NTFY_TOPIC }} || true

      - name: Notify — failure
        if: failure()
        run: |
          curl -s -X POST \
            -H "Title: Bilinguist Brief — Failed ❌" \
            -H "Priority: high" \
            -H "Tags: rotating_light" \
            -d "Briefing generation failed. Check GitHub Actions for details: https://github.com/will-diggle/Claude-Routines/actions" \
            https://ntfy.sh/${{ secrets.NTFY_TOPIC }} || true
