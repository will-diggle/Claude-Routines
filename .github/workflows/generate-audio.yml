name: Generate Audio (post fact-sweep)

# Added 2026-09-18. Runs Audio Narration AFTER the "Bilinguist Brief daily fact
# sweep" routine has verified/fixed/promoted staging to main -- not as part of
# the main generate-briefings.yml job anymore. Rationale: Audio Narration used
# to run before the fact-sweep's staging push, generating narration from
# whatever text existed at that moment. If the sweep then edited the article
# text and promoted a corrected version to main, the audio stayed tied to the
# old, pre-fix wording -- text and audio would disagree. This workflow instead
# runs once main already holds the final, corrected content, dispatched by the
# fact-sweep routine itself right after it merges staging into main.
#
# bilinguist_audio.py is unmodified -- it hardcodes reading/writing
# output/latest.json and output/{date}.json (see its module docstring). Rather
# than change that shared script's interface, this workflow just builds the
# same directory shape it expects from a fresh bilinguist-data clone, runs it
# as-is, then MERGES just the resulting audioKey fields back into a freshly
# re-fetched copy of main (merge_audio_keys.py) -- it does not push the
# processed copy directly.
#
# That merge step exists because of a real incident on 2026-09-18: this job's
# TTS run takes several minutes, and the original version of this workflow
# cloned bilinguist-data once at job start, then blindly overwrote
# latest.json/briefings/{date}.json with that stale snapshot at push time.
# Twice that morning, the fact-sweep routine committed a real fix to main
# *while this job was mid-run*, and this job's push silently reverted it --
# confirmed via the fact-sweep's own follow-up investigation (see
# Claude-Routines git history around 2026-09-18 11:05 UTC). Re-fetching main
# immediately before pushing, and merging in only audioKey (never touching
# body/headline/anything else), is what actually delivers the "purely
# additive" guarantee bilinguist_audio.py's docstring already claims.

on:
  workflow_dispatch:
    inputs:
      date:
        description: "Brief date to generate audio for (YYYY-MM-DD). Defaults to today (UTC) if omitted."
        required: false

jobs:
  audio:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout app repo (for bilinguist_audio.py and its deps)
        uses: actions/checkout@v4
        with:
          ref: claude/build-app-from-brief-wNEna

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        working-directory: bilinguist-brief/scripts
        run: pip install -r requirements.txt

      - name: Resolve date
        run: |
          DATE="${{ github.event.inputs.date }}"
          if [ -z "$DATE" ]; then
            DATE=$(python3 -c "import datetime; print(datetime.datetime.now(datetime.timezone.utc).strftime('%Y-%m-%d'))")
          fi
          echo "BRIEF_DATE=$DATE" >> $GITHUB_ENV

      - name: Clone bilinguist-data at main
        env:
          DATA_REPO_TOKEN: ${{ secrets.DATA_REPO_TOKEN }}
        run: |
          git clone https://x-access-token:${DATA_REPO_TOKEN}@github.com/will-diggle/bilinguist-data.git /tmp/bilinguist-data

      - name: Shim main's content into the output/ shape bilinguist_audio.py expects
        run: |
          mkdir -p bilinguist-brief/scripts/output
          cp /tmp/bilinguist-data/latest.json bilinguist-brief/scripts/output/latest.json
          cp /tmp/bilinguist-data/briefings/${BRIEF_DATE}.json bilinguist-brief/scripts/output/${BRIEF_DATE}.json

      - name: Audio Narration (Global News, purely additive)
        working-directory: bilinguist-brief/scripts
        continue-on-error: true
        env:
          BRIEF_DATE: ${{ env.BRIEF_DATE }}
          GOOGLE_TTS_CREDENTIALS_B64: ${{ secrets.GOOGLE_TTS_CREDENTIALS_B64 }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: python bilinguist_audio.py

      - name: Merge audioKey into fresh main and push (retries on concurrent pushes)
        env:
          DATA_REPO_TOKEN: ${{ secrets.DATA_REPO_TOKEN }}
        run: |
          cd /tmp/bilinguist-data
          git config user.email "actions@github.com"
          git config user.name "Bilinguist Brief Bot"

          for attempt in 1 2 3 4 5; do
            # Re-fetch main FRESH, right before merging -- this may have moved
            # since the job started (a fact-sweep fix, another audio run, etc).
            # merge_audio_keys.py only ever ADDS a missing audioKey field; it
            # never overwrites body/headline/anything else in this fresh copy.
            git fetch origin main
            git checkout main
            git reset --hard origin/main

            python3 "$GITHUB_WORKSPACE/bilinguist-brief/scripts/merge_audio_keys.py" \
              latest.json "$GITHUB_WORKSPACE/bilinguist-brief/scripts/output/latest.json"
            python3 "$GITHUB_WORKSPACE/bilinguist-brief/scripts/merge_audio_keys.py" \
              briefings/${BRIEF_DATE}.json "$GITHUB_WORKSPACE/bilinguist-brief/scripts/output/${BRIEF_DATE}.json"

            git add latest.json briefings/${BRIEF_DATE}.json

            if git diff --cached --quiet; then
              echo "No audio changes to commit (already covered by a previous run)."
              break
            fi

            git commit -m "Audio narration: ${BRIEF_DATE}"

            if git push origin main; then
              echo "Pushed on attempt ${attempt}."
              break
            fi

            echo "Push rejected (attempt ${attempt}) -- likely a concurrent push landed. Retrying with a fresh fetch."
            git reset --hard HEAD~1
            if [ "$attempt" = "5" ]; then
              echo "::error::Failed to push audioKey update after 5 attempts -- leaving audio ungenerated for ${BRIEF_DATE} rather than force-pushing over a concurrent change."
              exit 1
            fi
          done
