name: Build & Submit to TestFlight

on:
  workflow_dispatch:
  push:
    branches:
      - claude/build-app-from-brief-wNEna
    paths:
      - 'bilinguist-brief/src/**'
      - 'bilinguist-brief/assets/**'
      - 'bilinguist-brief/App.tsx'
      - 'bilinguist-brief/app.json'
      - 'bilinguist-brief/package.json'
      - 'bilinguist-brief/babel.config.js'

jobs:
  build-and-submit:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: bilinguist-brief
        run: rm -f package-lock.json && npm install

      - name: Inject API keys into eas.json
        working-directory: bilinguist-brief
        env:
          DEEPL_API_KEY: ${{ secrets.DEEPL_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ELEVENLABS_VOICE_FR: ${{ secrets.ELEVENLABS_VOICE_FR }}
          ELEVENLABS_VOICE_DE: ${{ secrets.ELEVENLABS_VOICE_DE }}
          ELEVENLABS_VOICE_SV: ${{ secrets.ELEVENLABS_VOICE_SV }}
          ELEVENLABS_VOICE_EN: ${{ secrets.ELEVENLABS_VOICE_EN }}
          ELEVENLABS_VOICE_IT: ${{ secrets.ELEVENLABS_VOICE_IT }}
          ELEVENLABS_VOICE_ES: ${{ secrets.ELEVENLABS_VOICE_ES }}
        run: |
          node -e "
            const fs = require('fs');
            const eas = JSON.parse(fs.readFileSync('eas.json', 'utf8'));
            const env = eas.build.production.env || {};
            const map = {
              DEEPL_API_KEY:        'EXPO_PUBLIC_DEEPL_API_KEY',
              ELEVENLABS_API_KEY:   'EXPO_PUBLIC_ELEVENLABS_API_KEY',
              ANTHROPIC_API_KEY:    'EXPO_PUBLIC_ANTHROPIC_API_KEY',
              ELEVENLABS_VOICE_FR:  'EXPO_PUBLIC_ELEVENLABS_VOICE_FR',
              ELEVENLABS_VOICE_DE:  'EXPO_PUBLIC_ELEVENLABS_VOICE_DE',
              ELEVENLABS_VOICE_SV:  'EXPO_PUBLIC_ELEVENLABS_VOICE_SV',
              ELEVENLABS_VOICE_EN:  'EXPO_PUBLIC_ELEVENLABS_VOICE_EN',
              ELEVENLABS_VOICE_IT:  'EXPO_PUBLIC_ELEVENLABS_VOICE_IT',
              ELEVENLABS_VOICE_ES:  'EXPO_PUBLIC_ELEVENLABS_VOICE_ES',
            };
            for (const [secret, expoKey] of Object.entries(map)) {
              if (process.env[secret]) env[expoKey] = process.env[secret];
            }
            eas.build.production.env = env;
            fs.writeFileSync('eas.json', JSON.stringify(eas, null, 2));
            console.log('Injected keys:', Object.keys(env).join(', '));
          "

      - name: Build iOS app
        working-directory: bilinguist-brief
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: npx eas-cli build --platform ios --profile production --non-interactive

      - name: Submit to TestFlight
        working-directory: bilinguist-brief
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: npx eas-cli submit --platform ios --latest --non-interactive
