name: Deploy App Update

on:
  workflow_dispatch:
  push:
    branches:
      - claude/build-app-from-brief-wNEna
    paths:
      - 'bilinguist-brief/src/**'
      - 'bilinguist-brief/assets/**'
      - 'bilinguist-brief/App.tsx'
      - 'bilinguist-brief/app.json'
      - 'bilinguist-brief/eas.json'

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: bilinguist-brief/package-lock.json

      - name: Install dependencies
        working-directory: bilinguist-brief
        run: npm install

      - name: Create .env
        working-directory: bilinguist-brief
        run: |
          echo "EXPO_PUBLIC_WORKER_URL=${{ secrets.EXPO_PUBLIC_WORKER_URL }}" > .env

      - name: Publish EAS update
        id: eas
        working-directory: bilinguist-brief
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          set -o pipefail
          # tee writes to log in real-time AND saves to file — so errors are always visible
          npx eas-cli update --branch preview --message "Auto-deploy from push" --non-interactive \
            2>&1 | tee /tmp/eas-output.txt
          # Extract the group UUID (exclude the projectId UUID)
          GROUP=$(grep -oE '[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}' /tmp/eas-output.txt \
            | grep -v '4f33f632-5650-43d6-881b-4b006eee705f' | head -1)
          echo "group=$GROUP" >> "$GITHUB_OUTPUT"

      - name: Post preview link as commit comment
        if: steps.eas.outputs.group != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          GROUP="${{ steps.eas.outputs.group }}"
          PROJECT="4f33f632-5650-43d6-881b-4b006eee705f"
          URL="https://expo.dev/preview/update?projectId=${PROJECT}&group=${GROUP}"
          curl -s -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Content-Type: application/json" \
            "https://api.github.com/repos/${{ github.repository }}/commits/${{ github.sha }}/comments" \
            -d "{\"body\": \"📱 **App updated — open in Expo Go:**\\n\\n${URL}\\n\\n_Tap this link on your phone → opens in Expo Go_\"}"
