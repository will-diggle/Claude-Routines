name: Deploy App Update

on:
  workflow_dispatch:
  push:
    branches:
      - claude/build-app-from-brief-wNEna
    paths:
      - 'bilinguist-brief/src/**'
      - 'bilinguist-brief/assets/**'
      - 'bilinguist-brief/App.tsx'
      - 'bilinguist-brief/app.json'
      - 'bilinguist-brief/eas.json'
      - 'bilinguist-brief/package.json'
      - 'bilinguist-brief/babel.config.js'

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: bilinguist-brief/package-lock.json

      - name: Install dependencies
        working-directory: bilinguist-brief
        run: npm install

      - name: Create .env
        working-directory: bilinguist-brief
        run: |
          echo "EXPO_PUBLIC_WORKER_URL=${{ secrets.EXPO_PUBLIC_WORKER_URL }}" > .env

      - name: Publish EAS update
        id: eas
        working-directory: bilinguist-brief
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          CI: "1"
        run: |
          # Run eas update, capturing stdout and stderr separately
          npx eas-cli update --branch preview --message "Auto-deploy from push" \
            --json --non-interactive \
            > /tmp/eas-stdout.json \
            2> /tmp/eas-stderr.txt \
            || { echo "=== EAS FAILED ==="; cat /tmp/eas-stderr.txt; cat /tmp/eas-stdout.json; exit 1; }

          echo "=== EAS stdout ==="; cat /tmp/eas-stdout.json
          echo "=== EAS stderr ==="; cat /tmp/eas-stderr.txt || true

          # Try jq on stdout first (clean JSON)
          GROUP=$(jq -r '.[0].group // .group // empty' /tmp/eas-stdout.json 2>/dev/null || echo "")

          # Fallback: scan both files for any UUID that isn't the project ID
          if [ -z "$GROUP" ]; then
            GROUP=$(cat /tmp/eas-stdout.json /tmp/eas-stderr.txt \
              | grep -oiE '[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}' \
              | grep -iv '4f33f632-5650-43d6-881b-4b006eee705f' \
              | head -1 || echo "")
          fi

          # Last resort: query EAS API directly for the latest update on this branch
          if [ -z "$GROUP" ]; then
            echo "Falling back to EAS API query..."
            API_RESP=$(curl -s \
              -H "Authorization: Bearer $EXPO_TOKEN" \
              -H "Content-Type: application/graphql" \
              "https://api.expo.dev/graphql" \
              --data-raw '{"query":"{ app { byId(appId: \"4f33f632-5650-43d6-881b-4b006eee705f\") { updateBranchByName(name: \"preview\") { updates(offset: 0, limit: 1) { group } } } } }"}' \
              || echo "")
            echo "EAS API response: $API_RESP"
            GROUP=$(echo "$API_RESP" | jq -r '.data.app.byId.updateBranchByName.updates[0].group // empty' 2>/dev/null || echo "")
          fi

          echo "Extracted group UUID: '$GROUP'"
          echo "group=$GROUP" >> "$GITHUB_OUTPUT"

      - name: Post preview link as commit comment
        # Always runs after a successful deploy — posts direct link or dashboard fallback
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PROJECT="4f33f632-5650-43d6-881b-4b006eee705f"
          GROUP="${{ steps.eas.outputs.group }}"

          if [ -n "$GROUP" ]; then
            URL="https://expo.dev/preview/update?projectId=${PROJECT}&group=${GROUP}"
            BODY="📱 **App updated — open in Expo Go:**\n\n${URL}\n\n_Tap this link on your phone → opens in Expo Go_"
          else
            URL="https://expo.dev/accounts/will-diggle/projects/bilinguist-brief/updates"
            BODY="📱 **App updated** — open the [Expo updates dashboard](${URL}), tap the latest update, and open the preview link in Expo Go."
          fi

          echo "Posting: $BODY"
          curl -sf -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Content-Type: application/json" \
            "https://api.github.com/repos/${{ github.repository }}/commits/${{ github.sha }}/comments" \
            -d "{\"body\": \"${BODY}\"}" \
            && echo "Comment posted OK" \
            || echo "WARNING: comment post failed"
