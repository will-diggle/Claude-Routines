name: Deploy Cloudflare Worker

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: claude/build-app-from-brief-wNEna

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Worker dependencies
        working-directory: bilinguist-worker
        run: npm install

      - name: Create or find D1 database
        working-directory: bilinguist-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # Try to create the database; if it already exists this will fail
          DB_ID=$(npx wrangler d1 create bilinguist-words --json 2>/dev/null | jq -r '.uuid' 2>/dev/null || true)
          # If create failed (already exists), find it in the list
          if [ -z "$DB_ID" ] || [ "$DB_ID" = "null" ]; then
            DB_ID=$(npx wrangler d1 list --json 2>/dev/null | jq -r '.[] | select(.name == "bilinguist-words") | .uuid')
          fi
          echo "D1 database ID: $DB_ID"
          sed -i "s/REPLACE_WITH_YOUR_D1_ID/$DB_ID/g" wrangler.toml

      - name: Deploy Worker
        working-directory: bilinguist-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy
