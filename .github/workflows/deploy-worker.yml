name: Deploy Cloudflare Worker

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: claude/build-app-from-brief-wNEna

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Worker dependencies
        working-directory: bilinguist-worker
        run: npm install

      - name: Create or find D1 database
        working-directory: bilinguist-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # Create the database (output contains the UUID regardless of format)
          CREATE_OUT=$(npx wrangler d1 create bilinguist-words 2>&1 || true)
          DB_ID=$(echo "$CREATE_OUT" | grep -oE '[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}' | head -1)

          if [ -z "$DB_ID" ]; then
            # Database already exists — find it via list
            LIST_OUT=$(npx wrangler d1 list 2>&1 || true)
            DB_ID=$(echo "$LIST_OUT" | grep 'bilinguist-words' | grep -oE '[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}' | head -1)
          fi

          echo "D1 database ID: $DB_ID"
          if [ -z "$DB_ID" ]; then echo "ERROR: could not determine D1 ID" && exit 1; fi
          sed -i "s/REPLACE_WITH_YOUR_D1_ID/$DB_ID/g" wrangler.toml

      - name: Deploy Worker
        working-directory: bilinguist-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy
