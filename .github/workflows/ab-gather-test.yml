name: A/B — factbase depth (deepening pass)

# Answers one question: does an extra grounded call per story produce enough more
# source material to justify its cost?
#
# This matters because source material caps article length. Measured 2026-08-09,
# gather produced ~103 words of facts per story while native articles asked for
# 250 — and that gap is what made the writer pad, then invent. Native targets were
# lowered to 180-200 as a result. If deepening lifts source to ~200+ words, longer
# articles become reachable again without inventing them.
#
# Both arms scrape ONCE, so selection sees identical headlines.
# Never pushes to the data repo — cannot affect the live brief.

on:
  workflow_dispatch:

jobs:
  ab:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/build-app-from-brief-wNEna

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        working-directory: bilinguist-brief/scripts
        run: pip install -r requirements.txt

      - name: Set date
        run: echo "BRIEF_DATE=$(python3 -c "import datetime; print(datetime.datetime.now(datetime.timezone.utc).strftime('%Y-%m-%d'))")" >> $GITHUB_ENV

      - name: Scrape ONCE — both arms select from identical headlines
        working-directory: bilinguist-brief/scripts
        env:
          BRIEF_DATE: ${{ env.BRIEF_DATE }}
        run: python bilinguist_scrape.py

      - name: ARM A — gather as it runs today
        working-directory: bilinguist-brief/scripts
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          BRIEF_DATE: ${{ env.BRIEF_DATE }}
        run: |
          START=$(date +%s)
          python bilinguist_gather.py
          echo "ARM_A_SECS=$(($(date +%s) - START))" >> $GITHUB_ENV
          cp factbase_${{ env.BRIEF_DATE }}.json factbase_A.json

      - name: ARM B — same, plus one grounded call per story
        working-directory: bilinguist-brief/scripts
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          BRIEF_DATE: ${{ env.BRIEF_DATE }}
        run: |
          START=$(date +%s)
          python bilinguist_gather.py --deepen
          echo "ARM_B_SECS=$(($(date +%s) - START))" >> $GITHUB_ENV
          cp factbase_${{ env.BRIEF_DATE }}.json factbase_B.json

      - name: RESULTS
        working-directory: bilinguist-brief/scripts
        env:
          ARM_A_SECS: ${{ env.ARM_A_SECS }}
          ARM_B_SECS: ${{ env.ARM_B_SECS }}
        run: |
          python ab_gather_compare.py factbase_A.json factbase_B.json
          echo
          echo "wall clock — A ${ARM_A_SECS}s | B ${ARM_B_SECS}s"

      - name: Upload both factbases
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ab-factbases-${{ env.BRIEF_DATE }}
          path: |
            bilinguist-brief/scripts/factbase_A.json
            bilinguist-brief/scripts/factbase_B.json
            bilinguist-brief/scripts/scraped_headlines_${{ env.BRIEF_DATE }}.json
