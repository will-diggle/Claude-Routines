name: "A/B — fact gathering: all 60 headlines vs winners only"

# ONE variable: what the fact-finding call is given.
#
# STAGE 0  scrape                                    — run once, shared
# STAGE 1  Gemini groups headlines, Python ranks them — run once, shared
# STAGE 2  fact-finding                              — THE TEST
#            ARM A: all 60 scraped headlines are sent, facts for 3 (Global) / 2 (others)
#            ARM B: only the ranked winners are sent
#
# Everything before stage 2 is identical and runs a single time, so both arms find facts
# for the same stories, same slugs, same ranks. Batch size is identical too: one call per
# genre in both arms. The only difference is the input.
#
# Why: Global News produced 87 narrative words per story while Business produced 514 from
# the same instruction, and Global spent roughly 80% of its answer retyping the 60
# headlines.
#
# Measured: narrative words, glossary words, and cost — per story and per genre.
#
# NARRATIVE vs GLOSSARY is reported separately. The old ~103 figure counted both
# together, but glossary words (figures, names) cannot be spun into prose — only
# narrative caps article length, so the combined number flattered the factbase.
#
# Both arms scrape ONCE. Never pushes to the data repo — cannot affect the live brief.

on:
  workflow_dispatch:

jobs:
  ab:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/build-app-from-brief-wNEna

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        working-directory: bilinguist-brief/scripts
        run: pip install -r requirements.txt

      - name: Set date
        run: echo "BRIEF_DATE=$(python3 -c "import datetime; print(datetime.datetime.now(datetime.timezone.utc).strftime('%Y-%m-%d'))")" >> $GITHUB_ENV

      - name: Scrape ONCE — both arms select from identical headlines
        working-directory: bilinguist-brief/scripts
        env:
          BRIEF_DATE: ${{ env.BRIEF_DATE }}
        run: python bilinguist_scrape.py

      - name: STAGE 1 (shared) — Gemini groups headlines, Python ranks them
        working-directory: bilinguist-brief/scripts
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          BRIEF_DATE: ${{ env.BRIEF_DATE }}
        # Run ONCE. Both arms then work from this identical ranked selection, so the same
        # stories, the same slugs and the same ranks go into both fact-finding calls.
        # Stage 1 is NOT under test and must not vary between arms.
        run: |
          python bilinguist_gather.py --select-only
          cp factbase_${{ env.BRIEF_DATE }}.json selection.json
          python - <<'PY'
          import json
          d = json.load(open("selection.json"))
          print(f"shared selection — {len(d['factbase'])} stories, both arms use these:")
          for s in d["factbase"]:
              x = s.get("cross_reference_score", {})
              print(f"  rank {x.get('rank')} [{x.get('total')}] {s['genre']} / {s['slug']}")
          PY

      - name: ARM A — facts with all 60 headlines sent, as production does
        working-directory: bilinguist-brief/scripts
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          BRIEF_DATE: ${{ env.BRIEF_DATE }}
        run: |
          START=$(date +%s)
          python bilinguist_gather.py --from selection.json --facts-input all
          echo "ARM_A_SECS=$(($(date +%s) - START))" >> $GITHUB_ENV
          cp factbase_${{ env.BRIEF_DATE }}.json factbase_A.json

      - name: ARM B — facts with only the ranked winners sent
        working-directory: bilinguist-brief/scripts
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          BRIEF_DATE: ${{ env.BRIEF_DATE }}
        run: |
          START=$(date +%s)
          python bilinguist_gather.py --from selection.json --facts-input winners
          echo "ARM_B_SECS=$(($(date +%s) - START))" >> $GITHUB_ENV
          cp factbase_${{ env.BRIEF_DATE }}.json factbase_B.json

      - name: Guard — B must still produce a notification and a search log
        working-directory: bilinguist-brief/scripts
        # Both used to be side-effects of the genre call. If the split drops them, the
        # brief loses its push notification and the morning diagnostic, so fail loudly
        # here rather than discovering it in production.
        run: |
          python - <<'PY'
          import json, sys
          b = json.load(open("factbase_B.json", encoding="utf-8"))
          bad = []
          if not (b.get("daily_notification") or "").strip():
              bad.append("daily_notification is empty")
          if not b.get("global_news_search_log"):
              bad.append("global_news_search_log is empty")
          missing = [s.get("slug") for s in b.get("factbase", [])
                     if not (s.get("what_happened") or [])]
          if missing:
              bad.append(f"stories with no facts: {missing}")
          print("notification:", (b.get("daily_notification") or "")[:200])
          print("search log outlets:", len(b.get("global_news_search_log") or []))
          if bad:
              sys.exit("GUARD FAILED — " + "; ".join(bad))
          print("guard passed")
          PY

      - name: RESULTS
        working-directory: bilinguist-brief/scripts
        env:
          ARM_A_SECS: ${{ env.ARM_A_SECS }}
          ARM_B_SECS: ${{ env.ARM_B_SECS }}
        run: |
          python ab_gather_compare.py factbase_A.json factbase_B.json
          echo
          echo "wall clock — A ${ARM_A_SECS}s | B ${ARM_B_SECS}s"

      - name: Upload both factbases
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ab-factbases-${{ env.BRIEF_DATE }}
          path: |
            bilinguist-brief/scripts/factbase_A.json
            bilinguist-brief/scripts/factbase_B.json
            bilinguist-brief/scripts/scraped_headlines_${{ env.BRIEF_DATE }}.json
