name: "A/B — fact gathering: all 60 headlines vs winners only"

# ARM A: production today. One call per genre does everything at once — reads all 60
#        scraped headlines, selects the stories, reports the groupings, and writes the
#        facts, in a single response.
# ARM B: the same batching — one call per genre, 3 stories for Global and 2 for the
#        others — but the fact-finding call receives ONLY the winning stories and their
#        own grouped headlines. Selection happens first in its own small call, Python
#        scores it as it already does, and nothing else shares the fact call.
#
# Answers: is the thin fact material caused by what we send the call, rather than by how
# many stories it has to cover?
#
# Batch size is held CONSTANT between arms, so it cannot explain a difference. Global News
# spent roughly 80% of its answer retyping the 60 headlines and produced 87 narrative words
# per story, while Business produced 514 from the same instruction.
#
# NARRATIVE vs GLOSSARY is reported separately. The old ~103 figure counted both
# together, but glossary words (figures, names) cannot be spun into prose — only
# narrative caps article length, so the combined number flattered the factbase.
#
# Both arms scrape ONCE. Never pushes to the data repo — cannot affect the live brief.

on:
  workflow_dispatch:

jobs:
  ab:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/build-app-from-brief-wNEna

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        working-directory: bilinguist-brief/scripts
        run: pip install -r requirements.txt

      - name: Set date
        run: echo "BRIEF_DATE=$(python3 -c "import datetime; print(datetime.datetime.now(datetime.timezone.utc).strftime('%Y-%m-%d'))")" >> $GITHUB_ENV

      - name: Scrape ONCE — both arms select from identical headlines
        working-directory: bilinguist-brief/scripts
        env:
          BRIEF_DATE: ${{ env.BRIEF_DATE }}
        run: python bilinguist_scrape.py

      - name: ARM A — gather as it runs today
        working-directory: bilinguist-brief/scripts
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          BRIEF_DATE: ${{ env.BRIEF_DATE }}
        run: |
          START=$(date +%s)
          python bilinguist_gather.py
          echo "ARM_A_SECS=$(($(date +%s) - START))" >> $GITHUB_ENV
          cp factbase_${{ env.BRIEF_DATE }}.json factbase_A.json

      # Quoted: an unquoted YAML scalar cannot contain ": " — it parses as a nested
      # mapping and invalidates the whole file.
      - name: "ARM B — same per-genre batching, but only the winning stories go in"
        working-directory: bilinguist-brief/scripts
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          BRIEF_DATE: ${{ env.BRIEF_DATE }}
        # Batching is IDENTICAL to arm A: one fact-finding call per genre, 3 stories for
        # Global News and 2 for the others. The single change is what goes into that call.
        #
        #   A: all 60 scraped headlines + select the stories + score them + write the
        #      facts, in one response. Global spent ~80% of its answer retyping the 60
        #      headlines and came out at 87 narrative words per story, against Business's
        #      514 from the same instruction.
        #   B: stage 1 groups and Python scores (as now); stage 2 receives ONLY the
        #      winning stories and their own grouped headlines, and does nothing but find
        #      facts.
        #
        # Because batch size is held constant, a difference here is caused by the input
        # and the competing task, not by calls-per-story.
        run: |
          START=$(date +%s)
          python bilinguist_gather.py --split --facts-per genre
          echo "ARM_B_SECS=$(($(date +%s) - START))" >> $GITHUB_ENV
          cp factbase_${{ env.BRIEF_DATE }}.json factbase_B.json

      - name: Guard — B must still produce a notification and a search log
        working-directory: bilinguist-brief/scripts
        # Both used to be side-effects of the genre call. If the split drops them, the
        # brief loses its push notification and the morning diagnostic, so fail loudly
        # here rather than discovering it in production.
        run: |
          python - <<'PY'
          import json, sys
          b = json.load(open("factbase_B.json", encoding="utf-8"))
          bad = []
          if not (b.get("daily_notification") or "").strip():
              bad.append("daily_notification is empty")
          if not b.get("global_news_search_log"):
              bad.append("global_news_search_log is empty")
          missing = [s.get("slug") for s in b.get("factbase", [])
                     if not (s.get("what_happened") or [])]
          if missing:
              bad.append(f"stories with no facts: {missing}")
          print("notification:", (b.get("daily_notification") or "")[:200])
          print("search log outlets:", len(b.get("global_news_search_log") or []))
          if bad:
              sys.exit("GUARD FAILED — " + "; ".join(bad))
          print("guard passed")
          PY

      - name: RESULTS
        working-directory: bilinguist-brief/scripts
        env:
          ARM_A_SECS: ${{ env.ARM_A_SECS }}
          ARM_B_SECS: ${{ env.ARM_B_SECS }}
        run: |
          python ab_gather_compare.py factbase_A.json factbase_B.json
          echo
          echo "wall clock — A ${ARM_A_SECS}s | B ${ARM_B_SECS}s"

      - name: Upload both factbases
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ab-factbases-${{ env.BRIEF_DATE }}
          path: |
            bilinguist-brief/scripts/factbase_A.json
            bilinguist-brief/scripts/factbase_B.json
            bilinguist-brief/scripts/scraped_headlines_${{ env.BRIEF_DATE }}.json
