name: A/B — fact collection per topic vs per article

# ARM A: fact collection by topic — 3 calls, one per genre, each selecting 2-3
#        stories AND reporting their facts. This is production today.
# ARM B: fact collection by article — arm A's selection, then 7 calls, one per
#        story, each searching and building that story's facts alone.
#
# Answers: does giving each story its own call and its own search produce more
# usable source material, and what does it cost?
#
# This matters because source material caps article length. A genre call has to
# split one response across 2-3 stories, so each gets a fraction of the attention
# and the output budget. Native articles were asking for 250 words against roughly
# 103 words of facts per story, and that gap is what made the writer pad, then
# invent. Native targets were lowered to 180-200 as a result.
#
# NARRATIVE vs GLOSSARY is reported separately. The old ~103 figure counted both
# together, but glossary words (figures, names) cannot be spun into prose — only
# narrative caps article length, so the combined number flattered the factbase.
#
# Both arms scrape ONCE and share one selection, so the single variable is where
# fact collection happens. Never pushes to the data repo — cannot affect the brief.

on:
  workflow_dispatch:

jobs:
  ab:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/build-app-from-brief-wNEna

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        working-directory: bilinguist-brief/scripts
        run: pip install -r requirements.txt

      - name: Set date
        run: echo "BRIEF_DATE=$(python3 -c "import datetime; print(datetime.datetime.now(datetime.timezone.utc).strftime('%Y-%m-%d'))")" >> $GITHUB_ENV

      - name: Scrape ONCE — both arms select from identical headlines
        working-directory: bilinguist-brief/scripts
        env:
          BRIEF_DATE: ${{ env.BRIEF_DATE }}
        run: python bilinguist_scrape.py

      - name: ARM A — gather as it runs today
        working-directory: bilinguist-brief/scripts
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          BRIEF_DATE: ${{ env.BRIEF_DATE }}
        run: |
          START=$(date +%s)
          python bilinguist_gather.py
          echo "ARM_A_SECS=$(($(date +%s) - START))" >> $GITHUB_ENV
          cp factbase_${{ env.BRIEF_DATE }}.json factbase_A.json

      - name: ARM B — split pipeline: select, then find facts per story
        working-directory: bilinguist-brief/scripts
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          BRIEF_DATE: ${{ env.BRIEF_DATE }}
        # --split runs its own selection (gemini_prompt_select.md — groupings only, no
        # facts, no glossary, no 60-headline transcript) and then one grounded
        # fact-finding call per selected story, 7 concurrently.
        #
        # B selects independently rather than reusing A's factbase, because selection is
        # the thing being changed: A's selection call also has to write facts, B's does
        # not. Slugs may therefore differ between arms, and the comparison reports that
        # rather than pretending otherwise — the per-story table is only meaningful for
        # stories both arms picked. Read the totals and the averages.
        run: |
          START=$(date +%s)
          python bilinguist_gather.py --split
          echo "ARM_B_SECS=$(($(date +%s) - START))" >> $GITHUB_ENV
          cp factbase_${{ env.BRIEF_DATE }}.json factbase_B.json

      - name: Guard — B must still produce a notification and a search log
        working-directory: bilinguist-brief/scripts
        # Both used to be side-effects of the genre call. If the split drops them, the
        # brief loses its push notification and the morning diagnostic, so fail loudly
        # here rather than discovering it in production.
        run: |
          python - <<'PY'
          import json, sys
          b = json.load(open("factbase_B.json", encoding="utf-8"))
          bad = []
          if not (b.get("daily_notification") or "").strip():
              bad.append("daily_notification is empty")
          if not b.get("global_news_search_log"):
              bad.append("global_news_search_log is empty")
          missing = [s.get("slug") for s in b.get("factbase", [])
                     if not (s.get("what_happened") or [])]
          if missing:
              bad.append(f"stories with no facts: {missing}")
          print("notification:", (b.get("daily_notification") or "")[:200])
          print("search log outlets:", len(b.get("global_news_search_log") or []))
          if bad:
              sys.exit("GUARD FAILED — " + "; ".join(bad))
          print("guard passed")
          PY

      - name: RESULTS
        working-directory: bilinguist-brief/scripts
        env:
          ARM_A_SECS: ${{ env.ARM_A_SECS }}
          ARM_B_SECS: ${{ env.ARM_B_SECS }}
        run: |
          python ab_gather_compare.py factbase_A.json factbase_B.json
          echo
          echo "wall clock — A ${ARM_A_SECS}s | B ${ARM_B_SECS}s"

      - name: Upload both factbases
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ab-factbases-${{ env.BRIEF_DATE }}
          path: |
            bilinguist-brief/scripts/factbase_A.json
            bilinguist-brief/scripts/factbase_B.json
            bilinguist-brief/scripts/scraped_headlines_${{ env.BRIEF_DATE }}.json
