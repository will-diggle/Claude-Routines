name: Deploy willdiggle.co.uk

on:
  workflow_dispatch:
  push:
    branches:
      - claude/singing-site-cloudflare-migration-71arl1
    paths:
      - 'willdiggle/**'
      - '.github/workflows/deploy-willdiggle.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # The secrets context cannot be read from a step-level `if`, so surface
    # this one as an environment variable and test that instead.
    env:
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: willdiggle

      # Separate and conditional: wrangler-action fails the whole run if a
      # declared secret has no value, and the site should still deploy when
      # the contact form has not been configured yet.
      - name: Upload contact form secret
        if: env.RESEND_API_KEY != ''
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: willdiggle
          command: secret put RESEND_API_KEY
          secrets: |
            RESEND_API_KEY
