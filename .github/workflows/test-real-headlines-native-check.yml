name: "TEST: real headlines, native EN exact-210 + no-JSON, over full set"

# Runs today's real Stage 1-4 (scrape, select, gather winners, fact-check) exactly as
# production does, then Stage 5 (native EN longer) with the exact-210 + plain-text no-JSON
# overrides across every real winning story (not just 2 hardcoded ones), to get an average
# word-count deviation over a larger sample plus the real Stage 4 fact-check result. All
# local files -- never touches the data repo, the live app, or any Supabase/D1 write.

on:
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout app repo
        uses: actions/checkout@v4
        with:
          ref: claude/build-app-from-brief-wNEna

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        working-directory: bilinguist-brief/scripts
        run: pip install -r requirements.txt

      - name: Set pipeline date
        run: |
          echo "BRIEF_DATE=$(python3 -c "import datetime; print(datetime.datetime.now(datetime.timezone.utc).strftime('%Y-%m-%d'))")" >> $GITHUB_ENV

      - name: Run the real-headlines native check
        working-directory: bilinguist-brief/scripts
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          BRIEF_DATE: ${{ env.BRIEF_DATE }}
        run: python test_real_headlines_native_check.py | tee real_headlines_native_check_result.txt

      - name: Upload result as artifact
        uses: actions/upload-artifact@v4
        with:
          name: test-real-headlines-native-check-result
          path: bilinguist-brief/scripts/real_headlines_native_check_result.txt
          retention-days: 14
