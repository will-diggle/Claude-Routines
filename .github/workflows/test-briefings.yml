name: Test Briefing Pipeline

# Manual trigger only — never runs automatically.
# Use this to test pipeline changes before they go live in Generate Daily Briefings.
on:
  workflow_dispatch:
    inputs:
      date:
        description: 'Date to generate for (YYYY-MM-DD). Leave blank for today UTC.'
        required: false
        default: ''
      skip_gather:
        description: 'Skip Stage 1 (gather) — reuse existing factbase for the date.'
        type: boolean
        required: false
        default: false
      skip_factcheck:
        description: 'Skip Stage 1B (fact-check) — saves ~2 min and API cost.'
        type: boolean
        required: false
        default: false
      skip_push:
        description: 'Skip pushing bundle to bilinguist-data repo (safe default for tests).'
        type: boolean
        required: false
        default: true
      pin_factbase:
        description: 'A/B: reuse the published factbase for this date from bilinguist-data, so both arms see identical input.'
        type: boolean
        required: false
        default: false
      per_article:
        description: 'A/B arm B: one API call per (language, level, length, story).'
        type: boolean
        required: false
        default: false
      workers:
        description: 'Max concurrent API calls. Raise well above 4 for per_article and/or flex.'
        required: false
        default: '4'
      tier:
        description: 'Gemini service tier: standard or flex (50% cheaper, 1-15 min latency).'
        required: false
        default: 'standard'

jobs:
  test:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout app repo
        uses: actions/checkout@v4
        with:
          ref: claude/build-app-from-brief-wNEna

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        working-directory: bilinguist-brief/scripts
        run: pip install -r requirements.txt

      - name: Set pipeline date
        run: |
          if [ -n "${{ inputs.date }}" ]; then
            echo "BRIEF_DATE=${{ inputs.date }}" >> $GITHUB_ENV
          else
            echo "BRIEF_DATE=$(python3 -c "import datetime; print(datetime.datetime.now(datetime.timezone.utc).strftime('%Y-%m-%d'))")" >> $GITHUB_ENV
          fi

      - name: Notify test started
        run: |
          curl -s -X POST \
            -H "Title: [TEST] Bilinguist Pipeline - Starting" \
            -H "Tags: test_tube" \
            -d "Test run started for ${{ env.BRIEF_DATE }}. skip_gather=${{ inputs.skip_gather }} skip_factcheck=${{ inputs.skip_factcheck }} skip_push=${{ inputs.skip_push }}" \
            https://ntfy.sh/${{ secrets.NTFY_TOPIC }} || true

      - name: Pin factbase from data repo (A/B control)
        if: ${{ inputs.pin_factbase == true }}
        env:
          DATA_REPO_TOKEN: ${{ secrets.DATA_REPO_TOKEN }}
          BRIEF_DATE: ${{ env.BRIEF_DATE }}
        run: |
          git clone --depth 1 https://x-access-token:${DATA_REPO_TOKEN}@github.com/will-diggle/bilinguist-data.git /tmp/bilinguist-data
          python3 - <<'PYEOF'
          import json, os, sys
          date = os.environ["BRIEF_DATE"]
          src = f"/tmp/bilinguist-data/briefings/{date}.json"
          if not os.path.exists(src):
              sys.exit(f"No published bundle for {date} — cannot pin the factbase.")
          with open(src, encoding="utf-8") as f:
              bundle = json.load(f)
          factbase = bundle.get("factbase") or []
          if not factbase:
              sys.exit(f"Bundle for {date} has no factbase.")
          out = {
              "factbase": factbase,
              "daily_notification": bundle.get("daily_notification", ""),
              "global_news_search_log": bundle.get("global_news_search_log", []),
              "model": bundle.get("gatherSource", "gemini"),
              "pipeline_started_at": bundle.get("generatedAt"),
          }
          dest = f"bilinguist-brief/scripts/factbase_{date}.json"
          with open(dest, "w", encoding="utf-8") as f:
              json.dump(out, f, ensure_ascii=False, indent=2)
          print(f"Pinned {len(factbase)} stories from the published bundle -> {dest}")
          PYEOF

      - name: Stage 1 - Gather news
        if: ${{ inputs.skip_gather == false && inputs.pin_factbase == false }}
        working-directory: bilinguist-brief/scripts
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          BRIEF_DATE: ${{ env.BRIEF_DATE }}
        run: |
          START=$(date +%s)
          python bilinguist_gather.py
          echo "GATHER_SECS=$(($(date +%s) - START))" >> $GITHUB_ENV

      - name: Stage 1 - Gather (skipped)
        if: ${{ inputs.skip_gather == true || inputs.pin_factbase == true }}
        run: echo "Gather skipped — reusing existing factbase for ${{ env.BRIEF_DATE }}"

      - name: Stage 1B - Fact-check factbase
        if: ${{ inputs.skip_factcheck == false && inputs.pin_factbase == false }}
        working-directory: bilinguist-brief/scripts
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          BRIEF_DATE: ${{ env.BRIEF_DATE }}
        run: |
          START=$(date +%s)
          python bilinguist_factcheck.py
          echo "FACTCHECK_SECS=$(($(date +%s) - START))" >> $GITHUB_ENV

      - name: Stage 1B - Fact-check (skipped)
        if: ${{ inputs.skip_factcheck == true || inputs.pin_factbase == true }}
        run: echo "Fact-check skipped"

      - name: Stages 2-4 - Write and grade
        working-directory: bilinguist-brief/scripts
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          BRIEF_DATE: ${{ env.BRIEF_DATE }}
        run: |
          START=$(date +%s)
          python bilinguist_write.py --date ${{ env.BRIEF_DATE }} \
            ${{ inputs.per_article == true && '--per-article' || '' }} \
            --workers ${{ inputs.workers }} \
            --tier ${{ inputs.tier }}
          echo "WRITE_SECS=$(($(date +%s) - START))" >> $GITHUB_ENV

      - name: Stage 9 - Check & Publish
        working-directory: bilinguist-brief/scripts
        run: python bilinguist_check.py

      - name: Build timing report
        run: |
          GATHER_MIN=$(( ${GATHER_SECS:-0} / 60 ))
          GATHER_SEC=$(( ${GATHER_SECS:-0} % 60 ))
          FACTCHECK_MIN=$(( ${FACTCHECK_SECS:-0} / 60 ))
          FACTCHECK_SEC=$(( ${FACTCHECK_SECS:-0} % 60 ))
          WRITE_MIN=$(( ${WRITE_SECS:-0} / 60 ))
          WRITE_SEC=$(( ${WRITE_SECS:-0} % 60 ))
          TOTAL=$(( ${GATHER_SECS:-0} + ${FACTCHECK_SECS:-0} + ${WRITE_SECS:-0} ))
          TOTAL_MIN=$(( TOTAL / 60 ))
          TOTAL_SEC=$(( TOTAL % 60 ))

          TIMING="⏱ Stage timing:
            Gather:    ${GATHER_MIN}m ${GATHER_SEC}s
            Fact-check: ${FACTCHECK_MIN}m ${FACTCHECK_SEC}s
            Write+grade: ${WRITE_MIN}m ${WRITE_SEC}s
            Total: ${TOTAL_MIN}m ${TOTAL_SEC}s"

          echo "TEST_TIMING<<EOF" >> $GITHUB_ENV
          echo "$TIMING" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: Push bundle to data repo
        if: ${{ inputs.skip_push == false }}
        env:
          DATA_REPO_TOKEN: ${{ secrets.DATA_REPO_TOKEN }}
        run: |
          DATE=${{ env.BRIEF_DATE }}

          git clone https://x-access-token:${DATA_REPO_TOKEN}@github.com/will-diggle/bilinguist-data.git /tmp/bilinguist-data
          mkdir -p /tmp/bilinguist-data/briefings

          cp bilinguist-brief/scripts/output/latest.json /tmp/bilinguist-data/latest.json
          cp bilinguist-brief/scripts/output/${DATE}.json /tmp/bilinguist-data/briefings/${DATE}.json

          COSTS_JSON="bilinguist-brief/scripts/output/costs_${DATE}.json"
          if [ -f "$COSTS_JSON" ]; then
            python3 bilinguist-brief/scripts/update_costs_csv.py "$COSTS_JSON" "/tmp/bilinguist-data/costs.csv"
          fi

          cd /tmp/bilinguist-data
          git config user.email "actions@github.com"
          git config user.name "Bilinguist Brief Bot"
          git add latest.json briefings/${DATE}.json
          [ -f costs.csv ] && git add costs.csv || true

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "[TEST] Briefings: ${DATE}"
            git push
          fi

      - name: Push skipped
        if: ${{ inputs.skip_push == true }}
        run: echo "Push skipped — bundle stays local (run again with skip_push=false to publish)"

      - name: Notify test success
        if: success()
        env:
          NTFY_TITLE: ${{ env.BRIEF_TITLE || format('[TEST] Bilinguist Brief - {0}', env.BRIEF_DATE) }}
          NTFY_BODY: ${{ env.BRIEF_BODY }}
          NTFY_TIMING: ${{ env.TEST_TIMING }}
          NTFY_EMOJI: ${{ env.BRIEF_EMOJI || 'test_tube' }}
          NTFY_RUN_URL: https://github.com/will-diggle/Claude-Routines/actions
        run: |
          FULL_BODY="${NTFY_BODY}

          ${NTFY_TIMING}

          Run: ${NTFY_RUN_URL}"
          curl -s -X POST \
            -H "Title: [TEST] ${NTFY_TITLE}" \
            -H "Tags: ${NTFY_EMOJI}" \
            --data-binary "${FULL_BODY}" \
            https://ntfy.sh/${{ secrets.NTFY_TOPIC }} || true

      - name: Notify test failure
        if: failure()
        run: |
          curl -s -X POST \
            -H "Title: [TEST] Bilinguist Pipeline - Failed" \
            -H "Priority: high" \
            -H "Tags: rotating_light" \
            -d "Test run failed for ${{ env.BRIEF_DATE }}. Check logs: https://github.com/will-diggle/Claude-Routines/actions" \
            https://ntfy.sh/${{ secrets.NTFY_TOPIC }} || true
