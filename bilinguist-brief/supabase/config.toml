# Supabase project configuration.
# Run `supabase link --project-ref <your-project-ref>` to connect to your project.

[project]
# Find your project ref in: Supabase dashboard → Project Settings → General
id = "your-project-ref"

[functions.send-support-email]
# verify_jwt = false allows unauthenticated (anon key only) users to submit support
# requests. The anon key is already public in the app bundle, so this is the expected
# access level. Abuse protection relies on Supabase's built-in rate limiting.
verify_jwt = false

[functions.delete-account]
# verify_jwt = true — a valid signed-in user JWT is required.
# The function extracts the user ID from the verified token; the caller
# cannot delete any account other than their own.
verify_jwt = true

[functions.record-acceptance]
# verify_jwt = true — requires a signed-in user. The user ID is taken from the
# JWT, not from the request body, so a user can only record their own acceptance.
verify_jwt = true

[functions.update-profile]
# verify_jwt = true — requires a signed-in user. The user ID is taken from the
# JWT, not from the request body, so a user can only update their own profile.
verify_jwt = true

[functions.revenuecat-webhook]
# verify_jwt = false — RevenueCat sends no user JWT. Authentication is via the
# RC_WEBHOOK_SECRET shared secret validated inside the function body.
verify_jwt = false

[functions.register-push-token]
# verify_jwt = true — requires a signed-in user. The user ID is taken from the
# JWT, not from the request body, so a user can only register a token/schedule
# for their own account.
verify_jwt = true

[functions.send-morning-notifications]
# verify_jwt = true — called only by the pg_cron job, whose Bearer token is the
# service-role key (itself a valid signed JWT). Not user-facing.
verify_jwt = true

[functions.send-push]
# verify_jwt = false — never called by the client, and the caller isn't
# presenting an end-user session to verify. Instead, the function itself
# checks the Authorization header against SUPABASE_SERVICE_ROLE_KEY (same
# pattern as revenuecat-webhook's shared-secret check) — this used to be
# claimed here as already true without actually being enforced in code.
verify_jwt = false

[functions.search-username]
# verify_jwt = true — requires a signed-in user. Excludes the caller's own
# row from results; the caller's identity comes from the JWT, not the body.
verify_jwt = true

[functions.list-friends]
# verify_jwt = true — requires a signed-in user. Returns only the caller's
# own friendships/requests and their whitelisted columns, resolved from the JWT.
verify_jwt = true

[functions.create-friend-invite]
# verify_jwt = true — requires a signed-in user. The invite is always issued
# for the caller (from the JWT), never an arbitrary owner_id from the body.
verify_jwt = true

[functions.redeem-friend-invite]
# verify_jwt = true — requires a signed-in user. The resulting friendship is
# always addressed to the caller (from the JWT), never an arbitrary user.
verify_jwt = true
