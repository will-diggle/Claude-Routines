<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kontakt | Will Diggle Tenor</title>
<meta name="description" content="Nehmen Sie Kontakt mit dem britischen Tenor William Diggle auf – für Engagements, Konzerte und Anfragen.">
<meta property="og:title" content="Kontakt | Will Diggle Tenor">
<meta property="og:type" content="website">
<meta property="og:image" content="/img/contact-portrait.jpg">
<link rel="icon" href="/img/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;600&family=Oswald:wght@400;500&family=Poppins:wght@600&family=Raleway:wght@700&display=swap" rel="stylesheet">
<link rel="alternate" hreflang="en" href="https://willdiggle.co.uk/contact">
<link rel="alternate" hreflang="de" href="https://willdiggle.co.uk/de/contact">
<link rel="alternate" hreflang="x-default" href="https://willdiggle.co.uk/contact">
<link rel="stylesheet" href="/styles.css">
</head>
<body>
<a class="hp" href="#main">Zum Inhalt springen</a>

<header class="site-head">
  <div class="shell">
    <a class="brand" href="/de/" aria-label="Will Diggle – Startseite"><img src="/img/logo.png" alt="" width="35" height="44"></a>
    <button class="nav-toggle" aria-expanded="false" aria-controls="nav" aria-label="Menü"><span></span><span></span><span></span></button>
    <nav class="nav" id="nav">
      <ul>
        <li><a href="/de/about">Über mich</a></li>
        <li><a href="/de/listen">Hören</a></li>
        <li><a href="/de/contact" aria-current="page">Kontakt</a></li>
        <li><a href="/de/teaching">Unterricht</a></li>
      </ul>
    </nav>
    <div class="lang" role="group" aria-label="Sprache / Language"><a href="/contact" hreflang="en" lang="en" aria-label="English">EN</a><span class="lang-sep" aria-hidden="true">|</span><span class="lang-current" aria-current="true">DE</span></div>
    <a class="head-social" href="https://www.instagram.com/willdiggle.opera/" target="_blank" rel="noopener noreferrer" aria-label="Instagram"><img src="/img/header-icon.png" alt="" width="26" height="26"></a>
  </div>
</header>

<main id="main" class="contact-main">

  <!-- The title straddles the photo's edge: paper over the image, dark grey
       over the page ground. -->
  <h1 class="display title-xl contact-title" data-reveal><span class="a">Kontakt auf</span><span class="b">nehmen</span></h1>

  <div class="contact-grid">
    <picture>
      <source media="(max-width: 900px)" srcset="/img/contact-mobile.jpg">
      <img class="contact-photo" src="/img/contact-portrait.jpg" alt="Porträt von William Diggle" width="606" height="815">
    </picture>

    <div class="contact-form-wrap" data-reveal>
      <form id="contact-form" novalidate>
        <div class="form-grid">
          <div class="field">
            <label for="first">Vorname <span class="req" aria-hidden="true">*</span></label>
            <input id="first" name="first" type="text" autocomplete="given-name" required>
          </div>
          <div class="field">
            <label for="last">Nachname <span class="req" aria-hidden="true">*</span></label>
            <input id="last" name="last" type="text" autocomplete="family-name" required>
          </div>
          <div class="field full">
            <label for="email">E-Mail <span class="req" aria-hidden="true">*</span></label>
            <input id="email" name="email" type="email" autocomplete="email" required>
          </div>
          <div class="field full">
            <label for="phone">Telefon</label>
            <input id="phone" name="phone" type="tel" autocomplete="tel">
          </div>
          <div class="field full">
            <label for="message">Nachricht <span class="req" aria-hidden="true">*</span></label>
            <textarea id="message" name="message" required></textarea>
          </div>
          <div class="hp" aria-hidden="true">
            <label>Website<input type="text" name="website" tabindex="-1" autocomplete="off"></label>
          </div>
          <div class="form-actions">
            <button class="btn-submit" type="submit">Senden</button>
            <p class="form-status" role="status" aria-live="polite"></p>
          </div>
        </div>
      </form>
    </div>
  </div>

</main>

<footer class="site-foot">
  <div class="shell">
    <p>WILL DIGGLE 2025 &copy; ALLE RECHTE VORBEHALTEN. WEBDESIGN VON AriosoWebs</p>
    <a class="brand" href="/de/" aria-label="Will Diggle – Startseite"><img src="/img/logo.png" alt="" width="45" height="54"></a>
  </div>
</footer>

<script src="/site.js"></script>
</body>
</html>
