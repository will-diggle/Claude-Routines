<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contact | Will Diggle Tenor</title>
<meta name="description" content="British tenor William Diggle has performed with Opera Australia, New Generation Festival (Florence), Nevill Holt Opera and The Grange Festival. Having graduated from the Royal College of Music and Royal Academy of Music.">
<meta property="og:title" content="Contact | Will Diggle Tenor">
<meta property="og:description" content="British tenor William Diggle has performed with Opera Australia, New Generation Festival (Florence), Nevill Holt Opera and The Grange Festival. Having graduated from the Royal College of Music and Royal Academy of Music.">
<meta property="og:type" content="website">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@200;300;500&family=Poppins:wght@400;600&family=Jost:wght@300;400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/styles.css">
</head>
<body>
<a class="hp" href="#main">Skip to content</a>

<header class="site-head">
  <div class="wrap">
    <a class="wordmark" href="/">William Diggle</a>
    <button class="nav-toggle" aria-expanded="false" aria-controls="nav" aria-label="Menu">&#9776;</button>
    <nav class="nav" id="nav">
      <ul>
        <li><a href="/about">About</a></li>
        <li><a href="/listen">Listen</a></li>
        <li><a href="/diary">Diary</a></li>
        <li><a href="/contact" aria-current="page">Contact</a></li>
        <li><a href="/teaching">Teaching</a></li>
      </ul>
    </nav>
  </div>
</header>

<main id="main">
  <section>
    <div class="wrap">
      <h1 class="page-title">Get in touch</h1>
      <form id="contact-form" novalidate>
        <div class="form-grid">
          <div class="field">
            <label for="first">First name</label>
            <input id="first" name="first" type="text" autocomplete="given-name" required>
          </div>
          <div class="field">
            <label for="last">Last name</label>
            <input id="last" name="last" type="text" autocomplete="family-name">
          </div>
          <div class="field">
            <label for="email">Email</label>
            <input id="email" name="email" type="email" autocomplete="email" required>
          </div>
          <div class="field">
            <label for="phone">Phone</label>
            <input id="phone" name="phone" type="tel" autocomplete="tel">
          </div>
          <div class="field full">
            <label for="message">Message</label>
            <textarea id="message" name="message" rows="5" required></textarea>
          </div>
          <div class="hp" aria-hidden="true">
            <label>Website<input type="text" name="website" tabindex="-1" autocomplete="off"></label>
          </div>
          <div class="field full">
            <button class="btn" type="submit">Submit</button>
            <p class="form-status" role="status" aria-live="polite"></p>
          </div>
        </div>
      </form>
    </div>
  </section>
</main>

<footer class="site-foot">
  <div class="wrap">
    <p>Will Diggle 2025 &copy; All rights reserved. Web design by AriosoWebs</p>
  </div>
</footer>

<script src="/site.js"></script>
</body>
</html>
