<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CONTACT | Will Diggle Tenor</title>
<meta name="description" content="Get in touch with British tenor William Diggle for engagements, auditions and enquiries.">
<meta property="og:title" content="CONTACT | Will Diggle Tenor">
<meta property="og:type" content="website">
<meta property="og:image" content="/img/contact-portrait.jpg">
<link rel="icon" href="/img/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;600&family=Oswald:wght@400;500&family=Poppins:wght@600&family=Raleway:wght@700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/styles.css">
</head>
<body>
<a class="hp" href="#main">Skip to main content</a>

<header class="site-head">
  <div class="shell">
    <a class="brand" href="/" aria-label="Will Diggle — home"><img src="/img/logo.png" alt="" width="35" height="44"></a>
    <button class="nav-toggle" aria-expanded="false" aria-controls="nav" aria-label="Menu">&#9776;</button>
    <nav class="nav" id="nav">
      <ul>
        <li><a href="/about">About</a></li>
        <li><a href="/listen">Listen</a></li>
        <li><a href="/diary">Diary</a></li>
        <li><a href="/contact" aria-current="page">Contact</a></li>
        <li><a href="/teaching">Teaching</a></li>
      </ul>
    </nav>
  </div>
</header>

<main id="main" class="contact-main">

  <!-- The title straddles the photo's edge: paper over the image, dark grey
       over the page ground. -->
  <h1 class="display title-xl contact-title"><span class="a">Get in to</span><span class="b">uch</span></h1>

  <div class="contact-grid">
    <img class="contact-photo" src="/img/contact-portrait.jpg" alt="Portrait of William Diggle" width="606" height="815">

    <div class="contact-form-wrap">
      <form id="contact-form" novalidate>
        <div class="form-grid">
          <div class="field">
            <label for="first">First Name <span class="req" aria-hidden="true">*</span></label>
            <input id="first" name="first" type="text" autocomplete="given-name" required>
          </div>
          <div class="field">
            <label for="last">Last Name <span class="req" aria-hidden="true">*</span></label>
            <input id="last" name="last" type="text" autocomplete="family-name" required>
          </div>
          <div class="field full">
            <label for="email">Email <span class="req" aria-hidden="true">*</span></label>
            <input id="email" name="email" type="email" autocomplete="email" required>
          </div>
          <div class="field full">
            <label for="phone">Phone</label>
            <input id="phone" name="phone" type="tel" autocomplete="tel">
          </div>
          <div class="field full">
            <label for="message">Message <span class="req" aria-hidden="true">*</span></label>
            <textarea id="message" name="message" required></textarea>
          </div>
          <div class="hp" aria-hidden="true">
            <label>Website<input type="text" name="website" tabindex="-1" autocomplete="off"></label>
          </div>
          <div class="form-actions">
            <button class="btn-submit" type="submit">Submit</button>
            <p class="form-status" role="status" aria-live="polite"></p>
          </div>
        </div>
      </form>
    </div>
  </div>

</main>

<footer class="site-foot">
  <div class="shell">
    <p>WILL DIGGLE 2025 &copy; ALL RIGHTS RESERVED. WEB DESIGN BY AriosoWebs</p>
    <a class="brand" href="/" aria-label="Will Diggle — home"><img src="/img/logo.png" alt="" width="45" height="54"></a>
  </div>
</footer>

<script src="/site.js"></script>
</body>
</html>
